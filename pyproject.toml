[project]
name = "agant"
version = "0.1.0"
description = "AGANT - deteccion hibrida de fraude financiero (reglas + ML + grafo + Laya)"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

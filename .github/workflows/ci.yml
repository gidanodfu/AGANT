name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de test (sin GPU/torch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib duckdb psutil \
            "fastapi" "uvicorn" pydantic pydantic-settings websockets \
            httpx pytest pytest-asyncio
      - name: Tests backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Tests frontend
        run: npm test
      - name: Build CSS
        run: npm run build:css
